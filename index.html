<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dilsha & Rinshad Wedding Invitation</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#f8f2e8;
    color:#5c4632;
}

/* LOADER */
#loader{
    position:fixed;
    inset:0;
    z-index:9999;
    background:bisque;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    cursor:pointer;
}

.title{
    font-family:'Great Vibes',cursive;
    font-size:72px;
    color:#b8860b;
}

.scanner{
    width:220px;
    height:220px;
    position:relative;
    margin:20px 0;
}

.fingerprint{
    width:100%;
    height:100%;
    object-fit:contain;
    border:3px solid #d4af37;
    border-radius:50%;
    padding:15px;
    background:rgba(255,255,255,0.3);
}

.scan{
    position:absolute;
    left:10px;
    right:10px;
    height:4px;
    background:#d4af37;
    box-shadow:0 0 15px #d4af37;
    animation:scan 2s linear infinite;
}

@keyframes scan{
    from{top:15px;}
    to{top:190px;}
}

.tap{
    margin-top:20px;
    border:2px solid #d4af37;
    padding:15px 25px;
    border-radius:40px;
    color:#b8860b;
    animation:pulse 1.5s infinite;
}

@keyframes pulse{
    50%{
        transform:scale(1.05);
    }
}

/* MAIN PAGE */
.main{
    display:none;
    min-height:100vh;
    padding:20px;

    background:
    linear-gradient(rgba(255,248,240,.35),rgba(255,248,240,.35)),
    url('Image.png');

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
}

.card{
    max-width:700px;
    margin:auto;
    background:bisque;
    border:2px solid #d4af37;
    border-radius:30px;
    padding:30px;
    text-align:center;
    backdrop-filter:blur(6px);
}

.logo{
    font-family:'Great Vibes',cursive;
    font-size:64px;
    color:#b8860b;
}

.names{
    font-family:'Great Vibes',cursive;
    font-size:72px;
    line-height:1.1;
    color:#b8860b;
    margin-top:10px;
}

.countdown{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin:20px 0;
}

.box{
    background:#fff;
    padding:12px;
    border-radius:15px;
    min-width:80px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.box span{
    display:block;
    font-size:28px;
    font-weight:bold;
    color:#b8860b;
}

.btn{
    width:100%;
    padding:14px;
    margin-top:12px;
    border:none;
    border-radius:30px;
    background:#d4af37;
    color:#fff;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
}

.btn:hover{
    opacity:.9;
}
</style>
</head>

<body>

<!-- OPENING SCREEN -->
<div id="loader">

    <div class="title">D & R</div>

    <div class="scanner">
        <!-- Put your fingerprint image in the same folder -->
        <img src="fingerprint.png" alt="Fingerprint" class="fingerprint">
        <div class="scan"></div>
    </div>

    <h2>Marriage Ceremony Invitation</h2>

    <div class="tap">
        ✨ Touch Anywhere To Open Invitation ✨
    </div>

</div>

<!-- MAIN INVITATION -->
<div class="main" id="main">

    <div class="card">

        <div class="logo">D & R</div>

        <div style="font-size:42px;color:#b8860b;">﷽</div>

        <p>
            In the name of Allah, the Most Gracious, the Most Merciful
        </p>

        <h2 style="margin:15px 0;color:#b8860b;">
            MARRIAGE CEREMONY
        </h2>

        <div class="names">
            Dilsha
            <br>❤<br>
            Rinshad
        </div>

        <p style="margin-top:20px;">
            <b>Parents:</b> Rukiya & Salam
        </p>

        <p>
            <b>Brother:</b> Sinan
        </p>

        <h3 style="margin-top:20px;">
            📅 June 30 & July 1, 2026
        </h3>

        <p>📍 Wedding Venue</p>

        <div class="countdown">
            <div class="box">
                <span id="d">0</span>Days
            </div>

            <div class="box">
                <span id="h">0</span>Hours
            </div>

            <div class="box">
                <span id="m">0</span>Min
            </div>

            <div class="box">
                <span id="s">0</span>Sec
            </div>
        </div>

        <button class="btn"
        onclick="window.open('https://maps.app.goo.gl/hc9ELfuBSKEFDnec7')">
            📍 View Location
        </button>

        <button class="btn" onclick="toggleMusic()">
            🎵 Play / Pause Music
        </button>

    </div>

</div>

<!-- MUSIC -->
<audio id="music" loop autoplay>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<script>

// Open invitation + start music automatically
document.getElementById('loader').addEventListener('click', function(){

    const music = document.getElementById('music');

    music.play().catch(error=>{
        console.log(error);
    });

    document.getElementById('loader').style.display = 'none';
    document.getElementById('main').style.display = 'block';

});

// Play/Pause button
function toggleMusic(){
    const music = document.getElementById('music');

    if(music.paused){
        music.play();
    }else{
        music.pause();
    }
}

// Countdown
const target = new Date("2026-06-30T00:00:00").getTime();

setInterval(()=>{

    const diff = target - Date.now();

    document.getElementById("d").innerText =
    Math.max(0, Math.floor(diff / 86400000));

    document.getElementById("h").innerText =
    Math.max(0, Math.floor((diff % 86400000)/3600000));

    document.getElementById("m").innerText =
    Math.max(0, Math.floor((diff % 3600000)/60000));

    document.getElementById("s").innerText =
    Math.max(0, Math.floor((diff % 60000)/1000));

},1000);

</script>

</body>
</html>
